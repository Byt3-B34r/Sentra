# Mac variant: uses the NATIVE Ollama on the host (GPU-accelerated) instead of
# a containerized one. Bring up with:
#   docker compose -f compose.mac.yaml up --build

services:
  sentra-api:
    build:
      context: .
      dockerfile: Containerfile
    image: sentra:0.1.0
    container_name: sentra-api
    environment:
      OLLAMA_HOST: "http://host.docker.internal:11434"
      SENTRA_MODEL: "llama3.1:8b"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx,sys; sys.exit(0 if httpx.get('http://localhost:8000/healthz').text=='ok' else 1)\""]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

  prometheus:
    image: docker.io/prom/prometheus:latest
    container_name: sentra-prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - sentra-api

  grafana:
    image: docker.io/grafana/grafana:latest
    container_name: sentra-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./observability/grafana/dashboard-provider.yml:/etc/grafana/provisioning/dashboards/provider.yml:ro
      - ./observability/grafana/sentra-dashboard.json:/etc/grafana/provisioning/dashboards/sentra-dashboard.json:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
