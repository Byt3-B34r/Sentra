[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentra"
version = "0.1.0"
description = "Agentic SOC triage pipeline — multi-source telemetry to analyst-ready incident reports, air-gap capable on local LLM inference."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "SENTRA contributors" }]
keywords = ["soc", "security", "llm", "agentic", "attack", "triage", "observability"]

# Runtime deps required for the core pipeline + API + metrics.
dependencies = [
    "pydantic>=2.6,<3",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
# Production orchestration + semantic RAG. Optional so CI can run the pipeline
# (sequential runner + keyword retriever) without pulling the heavy stack.
agents = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "llama-index-core>=0.11",
    "llama-index-embeddings-ollama>=0.3",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "pyyaml>=6",
]

[project.scripts]
sentra = "sentra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "B008",   # FastAPI uses callables in defaults by design
    "UP042",  # str+Enum kept intentionally for stable Pydantic/JSON serialization
]

[tool.ruff.lint.per-file-ignores]
# Test fixtures embed raw log lines that cannot be wrapped without breaking them.
"tests/*" = ["E501"]
